<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https:; media-src 'self' file:; style-src 'self'">
  <title>MediaFlow Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

  <aside class="sidebar">
    <div class="side-head">
      <img class="brand-icon" src="../build/icon.png" alt="">
      <div class="brand-text"><b>MediaFlow</b><span>Studio</span></div>
    </div>
    <nav id="nav">
      <span class="nav-glider" aria-hidden="true"></span>
    </nav>
    <div class="side-foot">
      <button id="collapse" class="nav-item" type="button" data-i18n-title="app.collapseTip">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M15 10l-2 2 2 2"/></svg></span>
        <span class="nav-text" data-i18n="app.collapse"></span>
      </button>
      <button id="updates" class="nav-item" type="button">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6L20 8.7M20 4v4.7h-4.7"/><path d="M12 8v4.5l3 1.8"/></svg><i class="up-dot"></i></span>
        <span class="nav-text" data-i18n="up.check"></span>
      </button>
      <button id="settings-open" class="nav-item" type="button" data-i18n-title="set.tip">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
        <span class="nav-text" data-i18n="set.title"></span>
      </button>
      <!-- Hardware acceleration status (filled by app.js from the startup GPU test) -->
      <div id="gpu-status" class="gpu-status" role="status">
        <i class="gpu-dot" aria-hidden="true"></i>
        <span class="nav-text" id="gpu-label" data-i18n="gpu.checking"></span>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>
    </header>
    <div id="view" class="view"></div>
  </div>

  <div class="drop-overlay" aria-hidden="true">
    <div class="drop-ring">
      <svg viewBox="0 0 48 48"><path d="M24 30V10m0 0-8 8m8-8 8 8"/><path d="M10 28v7a5 5 0 0 0 5 5h18a5 5 0 0 0 5-5v-7"/></svg>
      <b data-i18n="drop.title"></b>
      <span data-i18n="drop.sub"></span>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="update" class="update" role="status" hidden>
    <span class="up-icon"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg></span>
    <div class="up-body"><b class="up-title"></b><span class="up-sub"></span><div class="bar"><i></i></div></div>
    <button class="primary up-action" type="button"></button>
    <button class="icon up-close" type="button" data-i18n-title="up.later"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>

  <!-- Load order: languages → i18n → sounds → shell → shared queue component → tools (sidebar order = script order). -->
  <script src="locales/en.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/de.js"></script>
  <script src="locales/pt.js"></script>
  <script src="locales/it.js"></script>
  <script src="locales/zh.js"></script>
  <script src="locales/ja.js"></script>
  <script src="locales/ko.js"></script>
  <script src="i18n.js"></script>
  <script src="sfx.js"></script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
  <script src="tools/queue.js"></script>
  <script src="tools/converter.js"></script>
  <script src="tools/downloader.js"></script>
  <script src="tools/trimmer.js"></script>
  <script src="tools/extractor.js"></script>
  <script src="tools/enhancer.js"></script>
  <script src="tools/compressor.js"></script>
  <script src="tools/autocut.js"></script>
  <script src="tools/gif.js"></script>
  <script src="tools/inspector.js"></script>
</body>
</html>
